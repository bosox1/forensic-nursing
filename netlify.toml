[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Односторінковий сайт: навігація через якорі (#misia тощо), тому SPA-фолбек «/* → index.html»
# прибрано — він віддавав 200 на будь-яку адресу, і Google бачив «м'які 404» та дублікати.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
